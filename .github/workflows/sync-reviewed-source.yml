name: Import reviewed DSH source and publish
on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-reviewed-source.yml]
permissions:
  contents: write
concurrency:
  group: dsh-plugins-reviewed-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify and import exact reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e1cddb77e1a16daf1f100bfb15cf3460e3d60034
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/source.bundle" https://github.com/ccl4-56-23-5/DSH-Plugins/releases/download/token-usage-v1.0.0/DSH-Plugins-sync-9625c46.bundle
          echo "6145c4a4f3e60ba00b865f45edc112d8c0fa74ba4a78f3e4777eb06871c0f50c  $RUNNER_TEMP/source.bundle" | sha256sum --check
          git bundle verify "$RUNNER_TEMP/source.bundle"
          git fetch "$RUNNER_TEMP/source.bundle" refs/heads/main:refs/remotes/reviewed/main
          test "$(git rev-parse reviewed/main)" = 9625c46a16e109712f122c3c5645c647c982438b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit reviewed/main
          git rm .github/workflows/sync-reviewed-source.yml
          test "$(git write-tree)" = "$(git rev-parse reviewed/main^{tree})"
          node scripts/verify-all.mjs
          git commit -m 'Import verified DSH plugin sources and release packages'
          git push origin HEAD:main
          echo "SYNC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish and verify release downloads
        uses: actions/github-script@v9
        with:
          script: |
            const scope = context.repo;
            const sha = process.env.SYNC_SHA;
            const release = (await github.rest.repos.getReleaseByTag({...scope,tag:'token-usage-v1.0.0'})).data;
            const transfer = release.assets.find(a=>a.name==='DSH-Plugins-sync-9625c46.bundle');
            if(transfer) await github.rest.repos.deleteReleaseAsset({...scope,asset_id:transfer.id});
            await github.rest.git.updateRef({...scope,ref:'tags/token-usage-v1.0.0',sha,force:true});
            const { default: publish } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-releases.mjs`);
            await publish({github,context:{...context,sha},core});
            const body = '基于HaoyueQin/dsh-usage-statistics-panel0.3.2的MIT定制版。保留原插件包名、历史统计格式、左上角入口和方块热力图；移除缓存命中率折线、百分比轴和图例，新增透明大肥鱼Logo。\n\nDSH地址安装使用：https://github.com/ccl4-56-23-5/DSH-Plugins/releases/download/token-usage-v1.0.0/dsh-usage-statistics-panel-1.0.0.tgz\n\n281项测试、Windows ZIP解压校验和独立离线安装通过；真实DSH替换与重启显示仍待验收。\n\n仓库main已同步完整源码，发布标签指向同步提交。Source.zip是该版本独立源码包；SHA256SUMS.txt提供交付文件校验值。源码包内VALIDATION.md是打包时记录，远端发布状态以本Release为准。\n\n上游：https://github.com/HaoyueQin/dsh-usage-statistics-panel';
            await github.rest.repos.updateRelease({...scope,release_id:release.id,body});
