name: Import verified switcher 2.1.5
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs'), path=require('node:path'), assert=require('node:assert/strict');
            const {createHash}=require('node:crypto'),{execFileSync}=require('node:child_process');
            assert.equal(context.repo.owner,'ccl4-56-23-5');assert.equal(context.repo.repo,'DSH-Plugins');assert.equal(context.ref,'refs/heads/main');
            const head=await github.rest.repos.getBranch({...context.repo,branch:'main'});assert.equal(head.data.commit.sha,context.sha);
            const root=process.env.GITHUB_WORKSPACE, git=args=>execFileSync('git',args,{cwd:root}).toString().trim();
            const bytes=fs.readFileSync(path.join(root,'DSH-Plugins-Publish-Source.zip'));
            assert.equal(createHash('sha256').update(bytes).digest('hex'),'5f6c8c89e4a56aa757d699c94ff24ff8e346da11c7ecf2a7ed11d9d250769404');
            const archive=path.join(process.env.RUNNER_TEMP,'verified-switcher-source.zip');fs.writeFileSync(archive,bytes);
            git(['rm','-r','-f','--ignore-unmatch','.']);
            execFileSync('python3',['-c',`import pathlib,sys,zipfile
            root=pathlib.Path(sys.argv[1]).resolve()
            with zipfile.ZipFile(sys.argv[2]) as z:
              for i in z.infolist():
                p=pathlib.PurePosixPath(i.filename)
                assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                assert (i.external_attr >> 16 & 0o170000) != 0o120000
                if i.is_dir(): continue
                target=(root/i.filename).resolve();assert target.is_relative_to(root)
                target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(i))
            `,root,archive],{stdio:'inherit'});
            git(['add','--all']);git(['add','-f','Api-Switcher插件/2.1.5/dist']);
            assert.equal(git(['write-tree']),'be742c3df93a867640571a2dc59ce36717a7190a');git(['checkout-index','--all','--force']);
            execFileSync('node',['scripts/verify-all.mjs'],{cwd:root,stdio:'inherit'});
            git(['config','user.name','github-actions[bot]']);git(['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
            git(['commit','-m','fix: restore MiMo image input and audit switcher capabilities 2.1.5']);git(['push','origin','HEAD:main']);
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'ci.yml',ref:'main'});
            core.info('Verified source imported; Windows/Linux checks and release workflow dispatched.');
